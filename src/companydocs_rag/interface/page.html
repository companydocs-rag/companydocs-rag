<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titel}}</title>
<style>
:root {
  --achtergrond: #f6f6f4;
  --vlak: #ffffff;
  --tekst: #1f2328;
  --zacht: #5b6470;
  --rand: #dcdcd6;
  --accent: #2f5d8a;
  --vraag: #e7edf4;
  --onvoldoende: #fff4e0;
  --onvoldoende-rand: #c98316;
  --ongeciteerd: #fbe9e9;
  --ongeciteerd-rand: #b8382b;
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
}
body {
  display: flex;
  flex-direction: column;
  background: var(--achtergrond);
  color: var(--tekst);
  font-family: system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--rand);
  background: var(--vlak);
}
header h1 {
  max-width: 820px;
  margin: 0 auto;
  font-size: 1.05rem;
  font-weight: 600;
}
main {
  flex: 1;
  overflow-y: auto;
  padding: 24px 16px 8px;
}
.kolom {
  max-width: 820px;
  margin: 0 auto;
}
.uitwisseling {
  margin: 0 0 28px;
}
.vraag {
  width: fit-content;
  max-width: 85%;
  margin-left: auto;
  padding: 10px 14px;
  border-radius: 16px;
  background: var(--vraag);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.antwoord {
  margin-top: 12px;
}
.antwoordtekst {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.melding,
.bezig {
  margin: 0;
  color: var(--zacht);
}
.bezig {
  font-style: italic;
}
.banner {
  margin-bottom: 10px;
  padding: 8px 12px;
  border-left: 4px solid;
  border-radius: 6px;
  font-weight: 600;
}
.banner-onvoldoende {
  border-color: var(--onvoldoende-rand);
  background: var(--onvoldoende);
}
.banner-ongeciteerd {
  border-color: var(--ongeciteerd-rand);
  background: var(--ongeciteerd);
}
.citaat {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
}
.citaat:hover,
.citaat:focus {
  text-decoration: underline;
}
.bronnen {
  margin-top: 16px;
}
.bronnen-kop {
  margin: 0 0 8px;
  color: var(--zacht);
  font-size: 0.95rem;
}
.bron {
  margin-bottom: 8px;
  padding: 10px 14px;
  border: 1px solid var(--rand);
  border-radius: 10px;
  background: var(--vlak);
}
.bron:target {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.bron-nummer {
  color: var(--accent);
  font-weight: 700;
}
.bron-type {
  font-weight: 600;
}
.bron-bestand,
.bron-hint {
  color: var(--zacht);
  overflow-wrap: anywhere;
}
.bron-hint {
  font-style: italic;
}
.bron-paginas {
  margin: 6px 0 0;
  padding: 0;
  list-style: none;
}
.paginanummer {
  font-weight: 600;
}
.paginalink {
  margin-left: 6px;
  color: var(--accent);
}
footer {
  padding: 12px 16px 10px;
  border-top: 1px solid var(--rand);
  background: var(--vlak);
}
form {
  display: flex;
  gap: 8px;
  max-width: 820px;
  margin: 0 auto;
}
textarea {
  flex: 1;
  min-height: 48px;
  max-height: 200px;
  padding: 10px 12px;
  border: 1px solid var(--rand);
  border-radius: 12px;
  font: inherit;
  resize: vertical;
}
button {
  padding: 0 18px;
  border: none;
  border-radius: 12px;
  background: var(--accent);
  color: #ffffff;
  font: inherit;
  cursor: pointer;
}
textarea:disabled,
button:disabled {
  opacity: 0.6;
  cursor: default;
}
.toelichting {
  max-width: 820px;
  margin: 6px auto 0;
  color: var(--zacht);
  font-size: 0.85rem;
}
</style>
</head>
<body>
<header><h1>{{titel}}</h1></header>
<main><div class="kolom" id="uitwisselingen"></div></main>
<footer>
<form id="vraagformulier" data-bezig="{{bezig}}" data-serverfout="{{serverfout}}">
<textarea id="vraag" rows="2" placeholder="{{invoertekst}}" aria-label="{{invoertekst}}"></textarea>
<button type="submit" id="verstuur">{{knop}}</button>
</form>
<p class="toelichting">{{toelichting}}</p>
</footer>
<script>
(function () {
  "use strict";
  var form = document.getElementById("vraagformulier");
  var input = document.getElementById("vraag");
  var button = document.getElementById("verstuur");
  var list = document.getElementById("uitwisselingen");
  var busyText = form.getAttribute("data-bezig");
  var failText = form.getAttribute("data-serverfout");
  var running = false;

  function setRunning(value) {
    running = value;
    input.disabled = value;
    button.disabled = value;
  }

  // An exchange built from text only: the question and one note.
  function exchange(question, noteClass, noteText) {
    var section = document.createElement("section");
    section.className = "uitwisseling";
    var asked = document.createElement("div");
    asked.className = "vraag";
    asked.textContent = question;
    var answer = document.createElement("div");
    answer.className = "antwoord";
    var note = document.createElement("p");
    note.className = noteClass;
    note.textContent = noteText;
    answer.appendChild(note);
    section.appendChild(asked);
    section.appendChild(answer);
    return section;
  }

  function place(oldNode, newNode) {
    list.replaceChild(newNode, oldNode);
    newNode.scrollIntoView({block: "end"});
  }

  function ask(question) {
    var pending = exchange(question, "bezig", busyText);
    list.appendChild(pending);
    pending.scrollIntoView({block: "end"});
    setRunning(true);
    fetch("/vraag", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({vraag: question})
    }).then(function (response) {
      if (response.status !== 200 && response.status !== 500) {
        throw new Error("status " + response.status);
      }
      return response.text();
    }).then(function (fragment) {
      // The server's fragment, in which every inserted text is escaped.
      var holder = document.createElement("div");
      holder.innerHTML = fragment;
      place(pending, holder);
    }).catch(function () {
      place(pending, exchange(question, "melding", failText));
    }).then(function () {
      setRunning(false);
      input.focus();
    });
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (running) {
      return;
    }
    var question = input.value;
    input.value = "";
    ask(question);
  });

  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      if (typeof form.requestSubmit === "function") {
        form.requestSubmit();
      } else {
        button.click();
      }
    }
  });

  input.focus();
}());
</script>
</body>
</html>
