[project]
name = "companydocs-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pillow==12.3.0",
    "preocr==1.11.0",
    "pypdfium2==5.13.0",
    "pyyaml>=6.0.3",
    "qdrant-client==1.19.1",
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
    "transformers==5.18.0",
]

[project.optional-dependencies]
# The judge route (retrieval.reranker: judge, Rutger's experiment): the d3 model
# code loads with a device map, which transformers only does with accelerate.
judge = [
    "accelerate==1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[project.scripts]
companydocs-parse-pass = "companydocs_rag.ingestion.cli:main"
companydocs-normalize = "companydocs_rag.ingestion.normalize_cli:main"
companydocs-chunk = "companydocs_rag.chunking.cli:main"
companydocs-index = "companydocs_rag.vectorstore.cli:main"
companydocs-search = "companydocs_rag.retrieval.cli:main"
companydocs-answer = "companydocs_rag.answering.cli:main"
companydocs-metadata = "companydocs_rag.metadata.cli:main"
companydocs-demo = "companydocs_rag.interface.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companydocs_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]